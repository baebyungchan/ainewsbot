[project]
name = "ainewsbot"
version = "1.0.0"
description = "AI news (GitHub trending, Reddit, HN, X via links, official blogs) → Telegram, run by GitHub Actions"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
